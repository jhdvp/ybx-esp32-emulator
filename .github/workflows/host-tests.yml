name: Host checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run standalone host test suite
        env:
          YBX_FIRMWARE_ROOT: /tmp/ybx-firmware-unavailable
        run: python -m unittest discover -s tools/ybx-system-emu -p 'test_*.py' -v
